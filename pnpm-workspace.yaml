packages:
  - packages/*
  - apps/*
  - examples/*/*
allowBuilds:
  core-js: false
  core-js-pure: false
  esbuild: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - eslint@10.14.0
overrides:
  # webpack >=5.100 breaks docusaurus' webpackbar (ProgressPlugin schema); matches the old yarn.lock
  webpack: 5.99.8
